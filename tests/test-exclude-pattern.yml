name: Test exclude pattern input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          path: tests/fixtures/clj-exclude
          pattern: '*.clj'
          exclude: '*/vendor/*'
          reporter: local
          filter_mode: nofilter
          fail_on_error: 'false'
          clj_kondo_version: 'RELEASE'

      - name: Assert action completed with exclude pattern
        run: |
          echo "Action completed successfully with exclude pattern applied"
          echo "PASS"
