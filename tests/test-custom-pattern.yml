name: Test custom file pattern
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Clojure source files with different extensions
        run: |
          mkdir -p src/myapp
          cat > src/myapp/core.clj << 'EOF'
          (ns myapp.core)

          (defn add
            "Adds two numbers."
            [a b]
            (+ a b))
          EOF
          cat > src/myapp/util.cljs << 'EOF'
          (ns myapp.util)

          (defn greet [name]
            (str "Hi " name))
          EOF

      - name: Run lint action with explicit .clj pattern
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_on_error: 'false'
          path: src
          pattern: '*.clj'

      - name: Assert action succeeded with pattern filter
        run: |
          echo "Action completed successfully with custom pattern *.clj"
          echo "PASS"
