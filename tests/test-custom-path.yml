name: Test clojure lint action with custom path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          path: ${{ github.workspace }}/pristine/nnichols--clojure-lint-action/v8/tests/fixtures/src
          pattern: '*.clj'
          reporter: local
          filter_mode: nofilter
          level: warning
          fail_on_error: 'false'

      - name: Assert action completed with custom path
        run: |
          echo "Action completed linting files in custom path"
          echo "PASS"
