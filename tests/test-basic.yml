name: Test basic Clojure lint
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample Clojure file
        run: |
          mkdir -p /tmp/clj-test
          cat > /tmp/clj-test/core.clj << 'EOF'
          (ns example.core)

          (defn hello [name]
            (str "Hello, " name "!"))
          EOF

      - id: action
        uses: .
        with:
          github_token: fake-token
          path: /tmp/clj-test
          pattern: '*.clj'
          reporter: local
          filter_mode: nofilter
          fail_on_error: 'false'

      - name: Assert action completed successfully
        run: |
          echo "Action completed without error"
          echo "PASS"
