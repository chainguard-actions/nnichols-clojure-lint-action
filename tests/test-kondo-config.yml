name: Test clj-kondo inline config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create clean Clojure source file
        run: |
          mkdir -p src/configured
          cat > src/configured/core.clj << 'EOF'
          (ns configured.core)

          (defn process
            "Processes input data."
            [data]
            (map inc data))
          EOF

      - name: Run lint action with inline clj-kondo config
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_on_error: 'false'
          path: src/configured
          clj_kondo_config: '{:linters {:unused-binding {:level :warning}}}'

      - name: Assert action succeeded with custom kondo config
        run: |
          echo "Action completed successfully with custom clj-kondo config"
          echo "PASS"
