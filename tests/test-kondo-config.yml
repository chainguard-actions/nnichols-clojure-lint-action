name: Test clj-kondo inline config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: dummy-token
          reporter: local
          filter_mode: nofilter
          fail_on_error: 'false'
          path: pristine/nnichols--clojure-lint-action/v10/tests/fixtures/src/dirty
          clj_kondo_config: '{:linters {:unused-binding {:level :off}}}'
      - name: Assert action succeeded with custom kondo config disabling unused-binding
        run: |
          echo "Action completed successfully - unused-binding warnings suppressed by config"
          echo "PASS"
