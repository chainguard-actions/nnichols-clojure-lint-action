name: Test specific clj-kondo version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: dummy-token
          reporter: local
          filter_mode: nofilter
          fail_on_error: 'false'
          path: pristine/nnichols--clojure-lint-action/v10/tests/fixtures/src/clean
          clj_kondo_version: '2024.09.27'
      - name: Assert action succeeded with specific clj-kondo version
        run: |
          echo "Action completed successfully with clj-kondo version 2024.09.27"
          echo "PASS"
