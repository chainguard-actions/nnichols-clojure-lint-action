name: Test lint Clojure fixtures
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: fake-token
          path: ${{ github.workspace }}/pristine/nnichols--clojure-lint-action/v7/tests/fixtures/src
          pattern: '*.clj'
          reporter: local
          filter_mode: nofilter
          fail_on_error: 'false'

      - name: Assert action completed successfully
        run: |
          echo "Lint action completed on fixture Clojure files"
          echo "PASS"
